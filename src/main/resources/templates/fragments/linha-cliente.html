<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- ===== Modo exibição ===== -->
  <tr th:fragment="linha(cliente)" th:id="'cliente-linha-' + ${cliente.id()}">
    <td th:text="${cliente.nome()}">Nome do cliente</td>
    <td th:text="${cliente.telefone()}">00000000000</td>
    <td>
      <span class="selo" th:classappend="'selo--' + ${cliente.statusCliente()}" th:text="${cliente.statusCliente()}">
        ATIVO
      </span>
    </td>
    <td class="tabela__acoes">
      <button
        type="button"
        class="icone-acao"
        title="Editar cliente"
        aria-label="Editar cliente"
        th:attr="hx-get=@{'/clientes/lista/' + ${cliente.id()} + '/editar'}"
        hx-target="closest tr"
        hx-swap="outerHTML"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
      </button>

      <button
        type="button"
        class="icone-acao icone-acao--perigo"
        title="Excluir cliente"
        aria-label="Excluir cliente"
        th:attr="hx-delete=@{'/clientes/lista/' + ${cliente.id()}},
                 hx-confirm='Marcar ' + ${cliente.nome()} + ' como inativo?'"
        hx-target="closest tr"
        hx-swap="outerHTML"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
        </svg>
      </button>
    </td>
  </tr>

  <!-- ===== Modo edição (nome e telefone; status não é editável aqui) ===== -->
  <tr th:fragment="linha-edicao(cliente)" th:id="'cliente-linha-' + ${cliente.id()}" class="linha-edicao">
    <td>
      <input type="text" name="nome" th:value="${cliente.nome()}" aria-label="Nome" required />
    </td>
    <td>
      <input type="text" name="telefone" th:value="${cliente.telefone()}" pattern="\d{11}" maxlength="11" inputmode="numeric" aria-label="Telefone" required />
    </td>
    <td>
      <span class="selo" th:classappend="'selo--' + ${cliente.statusCliente()}" th:text="${cliente.statusCliente()}">
        ATIVO
      </span>
    </td>
    <td class="tabela__acoes">
      <button
        type="button"
        class="icone-acao icone-acao--salvar"
        title="Salvar alterações"
        aria-label="Salvar alterações"
        th:attr="hx-post=@{'/clientes/lista/' + ${cliente.id()} + '/salvar'}"
        hx-include="closest tr"
        hx-target="closest tr"
        hx-swap="outerHTML"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
      </button>

      <button
        type="button"
        class="icone-acao"
        title="Cancelar edição"
        aria-label="Cancelar edição"
        th:attr="hx-get=@{'/clientes/lista/' + ${cliente.id()}}"
        hx-target="closest tr"
        hx-swap="outerHTML"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </td>
  </tr>

</body>
</html>
